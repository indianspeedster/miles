# doc-dev: docs/ci/00-stage.md
name: PR Test (ROCm)

# ROCm counterpart to pr-test.yml. Same structure, different GPU stage:
# calls _run-ci-rocm.yml instead of _run-ci.yml, using the ROCm container
# with HIP/CUDA compatibility.
#
# Test selection is explicit rather than inherited from the CUDA suites. The
# shared CI policy selects matching register_rocm_ci() labels for PR/nightly
# runs; manual dispatch keeps the full regular suite.
#
# One stage: stage-c-8-gpu-mi350, on a single full-node 8-GPU MI350X runner.
# Because there is exactly one runner there is no shard matrix -- the suite
# runs start to finish in one job. The 8-GPU width means CUDA tests needing 8
# GPUs run as-written, without the standalone 4-GPU test_amd_<name>.py variants
# the split MI300X fleet required.
#
# The MI300X stage is deliberately absent: this fork serves no MI300X runner,
# and a job whose runs_on matches nothing queues indefinitely rather than
# failing, which would stall every dispatch.
#
# resolve-ci-image emits the MI350 image only, resolved to the newest dated
# rocm720-mi35x tag because that line is rebuilt daily and a pinned date rots.
#
# pull_request_target keeps the workflow and fork authorization on the trusted
# base branch. A fork reaches the privileged self-hosted stage only after a
# maintainer adds a canonical `run-ci-*` label.
#
# The reusable job then checks out the PR merge ref explicitly. Fork PR jobs
# receive no repository secrets; the accepted label still authorizes their
# code to run against the MI300X host mounts.
#
# SGLang / Megatron-LM versions are baked into the ROCm image
# (_run-ci-rocm.yml defaults skip_dependency_install to true), so unlike
# pr-test.yml there are no ci_megatron_pr / ci_sglang_pr inputs here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  schedule:
    # Same nightly cadence as pr-test.yml; ci_policy.py maps this exact cron.
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      ci_image_tag_mi350:
        description: 'MI350 image tag (default: pinned miles-rocm720-mi35x-20260806)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.schedule || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve-ci-policy:
    runs-on: ubuntu-latest
    outputs:
      allow_self_hosted: ${{ steps.authorize.outputs.allow_self_hosted }}
      cadence: ${{ steps.resolve.outputs.cadence }}
      raw_labels: ${{ steps.resolve.outputs.raw_labels }}
      bypass_fastfail: ${{ steps.resolve.outputs.bypass_fastfail }}
    steps:
      - name: Authorize self-hosted PR execution
        id: authorize
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          BASE_REPOSITORY: ${{ github.repository }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          ALLOW_SELF_HOSTED=true
          if [[ "$EVENT_NAME" == "pull_request_target" && "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            ALLOW_SELF_HOSTED=false
            if jq -e 'any(.[]; test("^run-ci-[A-Za-z0-9][A-Za-z0-9_.-]*$"))' <<<"$PR_LABELS_JSON" >/dev/null; then
              ALLOW_SELF_HOSTED=true
            fi
          fi
          echo "allow_self_hosted=${ALLOW_SELF_HOSTED}" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve CI policy inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name == 'pull_request_target' && 'pull_request' || github.event_name }}
          SCHEDULE: ${{ github.event.schedule || '' }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python -m tests.ci.ci_policy

  resolve-ci-image:
    runs-on: ubuntu-latest
    outputs:
      mi350_image: ${{ steps.resolve.outputs.mi350_image }}
    steps:
      - name: Resolve CI image
        id: resolve
        shell: bash
        env:
          INPUT_TAG_MI350: ${{ github.event.inputs.ci_image_tag_mi350 || '' }}
        run: |
          set -euo pipefail
          REPO=rocm/sgl-dev

          # Reject a full image name pasted into a tag-only input.
          validate_tag() {
            if [[ ! "$1" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::$2 must be a Docker tag, not a full image name: $1"
              exit 1
            fi
          }

          # MI350: PINNED, not resolved to the newest dated tag.
          #
          # The resolver used to walk back from today and take the newest build. That
          # silently moved the image mid-investigation and cost hours: 20260807 broke
          # bit-exact weight-sync agreement on test_mtp1_spec_v2_r3, pushing the
          # first-step invariant abs(train/ppo_kl) < 1e-9 from 0.0 (20260806) to
          # -2.4e-09..-8.5e-09, reproduced on two separate MI350X hosts. Every other
          # metric stayed healthy, so it reads as a narrow numerical regression in the
          # baked sglang/Megatron/aiter versions.
          #
          # A silently-moving image also makes any failure ambiguous: you cannot tell
          # a code regression from an image regression. Bump this date deliberately,
          # after checking the suite still passes on it.
          TAG_MI350="${INPUT_TAG_MI350:-}"
          [ -z "$TAG_MI350" ] && TAG_MI350="miles-rocm720-mi35x-20260806"
          validate_tag "$TAG_MI350" "ci_image_tag_mi350"

          echo "mi350_image=${REPO}:${TAG_MI350}" >> "$GITHUB_OUTPUT"
          echo "Resolved MI350 image: ${REPO}:${TAG_MI350}"

  stage-c-8-gpu-mi350:
    needs: [resolve-ci-policy, resolve-ci-image]
    if: needs.resolve-ci-policy.outputs.allow_self_hosted == 'true'
    # One job per test rather than one job for the suite. The fork has a single
    # 8-GPU runner, so max-parallel: 1 serialises them anyway -- the win is that
    # each test gets its own job log (readable live, instead of waiting for one
    # multi-hour job to archive), its own retry budget, and can be cancelled
    # without killing the rest.
    #
    # Matrix order is deliberate, not alphabetical: the two that failed the last
    # full run go first, so a regression surfaces in minutes instead of hours.
    # fail-fast: false so one red test does not cancel the queue.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test:
          - tests/e2e/megatron/test_qwen3_5_35B_A3B_mtp/test_mtp1_spec_v2_r3.py
          - tests/e2e/megatron/test_qwen3_30B_A3B/test_deepep_fp8_bridge.py
          - tests/e2e/fsdp/test_qwen3_4B_fsdp_hybrid_shard_r2s2.py
          - tests/e2e/megatron/model_scripts/test_deepseek_v4_flash_4layer_ci.py
          - tests/e2e/megatron/model_scripts/test_glm5_2_744b_a40b_5layer_ci.py
          - tests/e2e/megatron/model_scripts/test_inkling_small_4layer_ci.py
          - tests/e2e/megatron/test_glm47_flash/test_r3_mtp.py
          - tests/e2e/megatron/test_qwen3_4B_offload_disk_stream.py
    name: ${{ matrix.test }}
    uses: ./.github/workflows/_run-ci-rocm.yml
    with:
      runs_on: '["self-hosted", "amd", "mi350", "8gpu"]'
      container_image: ${{ needs.resolve-ci-image.outputs.mi350_image }}
      checkout_ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      execute_command: >-
        python tests/ci/run_suite.py --hw rocm --suite stage-c-8-gpu-mi350
        --only ${{ matrix.test }}
        --cadence ${{ needs.resolve-ci-policy.outputs.cadence }}
        --labels ${{ needs.resolve-ci-policy.outputs.raw_labels }}
        ${{ github.event_name == 'workflow_dispatch' && '--match-all-labels' || '' }}
        --enable-retry --max-attempts 2
    secrets:
      WANDB_API_KEY: ${{ (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.WANDB_API_KEY || '' }}
